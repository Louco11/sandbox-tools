# Проверка ветки: контракт допуска → типы. Больше ничего.
# Workflow берётся из самой ветки, поэтому у джобы нет ни секретов, ни Docker, ни доступа к гейтвею:
# переписав этот файл в ветке, получить можно только то, что и так есть в ветке.
# Выкатывает деплоер (infra/deployer) после зелёного прогона: main → прод, ветка → превью изменённых тулов.
name: tools

on:
  push:
    branches: ['**']

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      # Без actions/checkout: CI не зависит от github.com, всё берётся из самой Gitea.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          AUTH="Authorization: Basic $(printf 'ci:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraHeader="$AUTH" fetch -q origin \
            "+refs/heads/main:refs/remotes/origin/main" "+$GITHUB_REF:refs/remotes/origin/current"
          git checkout -q "$GITHUB_SHA"

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Контракт допуска (tool.yaml против реестра)
        run: node packages/manifest/src/cli.ts

      - name: Типы
        run: npm run typecheck
