# Прокси до Holst MCP на хосте (127.0.0.1:47641).
# Holst отклоняет Host: host.docker.internal / IP шлюза — только 127.0.0.1 или localhost.
server {
  listen 80;
  location / {
    proxy_http_version 1.1;
    proxy_pass http://host.docker.internal:47641;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
