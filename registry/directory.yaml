# Справочник сотрудников — заглушка HR/IdP до шага Б1 (docs/roadmap.md). Решение человека, как и реестр: агенты его
# не правят. Гейтвей перечитывает файл без рестарта; сломанный не применяется, работает прежний.
#
# Хранит только исключения. Логин, которого здесь нет, считается работающим сотрудником.
#   people  — кто ушёл (active: false), кто чей руководитель, e-mail (по нему находим автора коммита);
#   groups  — владельцы-группы (очередь поддержки) и роли песочницы.
# Кто решает за владельца тула (продлить, удалить) и получает уведомления:
#   работает — он сам; ушёл — руководитель (вверх по цепочке); группа — её работающие участники;
#   никого — тул сразу уходит в простой, решают и получают уведомления sandbox-admins.
# Человек стенда (GITEA_HUMAN_USER) всегда входит в sandbox-admins и sandbox-approvers.

