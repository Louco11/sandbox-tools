# Реестр одобренных источников. Единственное место, где человек решает, к каким данным есть доступ.
# Изменение этого файла = решение ИБ и владельца данных. Агенты его не правят.
#
# Уровни чувствительности полей: public < internal < confidential < personal.

version: 1

policy:
  max_ttl_days: 90           # предел жизни от последнего явного продления владельцем;
                             # использование человеком продлевает срок на ttl_days, но не дальше этого предела
  token_ttl_seconds: 900     # срок жизни токена тула
  max_rows: 1000             # потолок строк на один запрос
  write_confirmation_ttl_seconds: 600
  idle_days: 30              # нет вызовов человека 30 дней → уведомление владельцу
  idle_grace_days: 7         # …и удаление через 7 дней, если никто не продлит и не воспользуется

sources:
  tasks-readonly:
    title: Задачи — доска команды и участники (только чтение)
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-18
    kind: connector
    connector:
      url: http://connector-tasks:8080
      token_env: CONNECTOR_TASKS_TOKEN
    datasets:
      tasks:
        description: Задачи команды
        fields:
          id: public
          title: internal
          description: internal
          status: internal
          priority: internal
          assignee: internal
          project: internal
          due_at: internal
          created_by: internal
          created_at: internal
          updated_at: internal
          done_at: internal
      people:
        description: Участники команды — возможные исполнители
        fields:
          id: public
          name: internal
          role: internal
          team: internal

  knowledge-readonly:
    title: Знания — заметки, решения, итоги и статьи команды (только чтение)
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-18
    kind: connector
    connector:
      url: http://connector-knowledge:8080
      token_env: CONNECTOR_KNOWLEDGE_TOKEN
    datasets:
      notes:
        description: Записи базы знаний; task_id — задача, к которой привязана запись
        fields:
          id: public
          task_id: public
          kind: internal
          title: internal
          body: internal
          tags: internal
          author: internal
          agent: internal
          created_at: internal

  boards-readonly:
    title: Доски — общие холсты команды и история их публикаций (только чтение)
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-18
    kind: connector
    connector:
      url: http://connector-boards:8080
      token_env: CONNECTOR_BOARDS_TOKEN
    datasets:
      boards:
        description: Опубликованные доски; content — элементы холста (стикеры, фигуры, стрелки, графики)
        fields:
          id: public
          name: internal
          content: internal
          version: public
          created_by: internal
          created_at: internal
          updated_by: internal
          updated_at: internal
      versions:
        description: Каждая публикация доски целиком — для истории и отката
        fields:
          board_id: public
          version: public
          name: internal
          content: internal
          saved_by: internal
          saved_at: internal
          note: internal

  pastry-readonly:
    title: Кондитерская — клиенты, заказы, каталог тортов, рецепты и склад
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    kind: connector
    connector:
      url: http://connector-pastry:8080
      token_env: CONNECTOR_PASTRY_TOKEN
    datasets:
      clients:
        description: Клиенты кондитера
        fields:
          id: public
          name: personal
          phone: personal
          email: personal
          notes: internal
          created_at: internal
          updated_at: internal
      ingredients:
        description: Позиции склада — продукты, упаковка, коробки, расходники; остатки
        fields:
          id: public
          name: internal
          unit: public
          stock_qty: internal
          low_threshold: internal
          created_at: internal
      cake_types:
        description: Фиксированный каталог тортов, цена за кг
        fields:
          id: public
          name: internal
          price_per_kg: internal
          active: public
          notes: internal
          created_at: internal
      recipe_lines:
        description: Рецепт торта — количество ингредиента на 1 кг
        fields:
          cake_type_id: public
          ingredient_id: public
          qty_per_kg: internal
      orders:
        description: Заказы тортов
        fields:
          id: public
          client_id: public
          cake_type_id: public
          weight_g: internal
          status: internal
          ordered_at: internal
          due_at: internal
          due_time: internal
          price_rub: confidential
          prepaid_rub: confidential
          comment: internal
          stock_deducted: internal
          created_by: internal
          created_at: internal
          updated_at: internal
      stock_moves:
        description: Движения склада — приход, корректировка, списание на выпечку
        fields:
          id: public
          ingredient_id: public
          qty_delta: internal
          reason: internal
          order_id: public
          note: internal
          decided_by: internal
          created_at: internal

  # Коннектор: сервис источника за гейтвеем (connectors/suppliers). Гейтвей проверяет скоуп и параметры и пишет
  # аудит, читает и пишет коннектор. Подключение нового источника — эта запись и сервис, без правки gateway/.
  suppliers-readonly:
    title: Поставщики — кто, где и почём поставляет продукты и упаковку (только чтение)
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    kind: connector
    connector:
      url: http://connector-suppliers:8080
      token_env: CONNECTOR_SUPPLIERS_TOKEN
    # Кому видны чувствительные поля источника: уровень → группы. Решение хранителя данных.
    field_groups:
      confidential: [procurement]
    datasets:
      suppliers:
        description: Поставщики; archived — в архиве, заказывать у них нельзя
        fields:
          id: public
          name: internal
          city: internal
          contact: confidential
          phone: confidential
          archived: internal
          created_by: internal
        # Кто какие строки видит: закупки по городам работают каждый со своими поставщиками.
        row_filter:
          field: city
          by_group:
            procurement-msk: [Москва]
            procurement-region: [Тверь, Подольск]
          unrestricted_groups: [procurement, sandbox-admins]
      offers:
        description: Предложения поставщиков — товар, единица и цена; active — поставщик не в архиве
        fields:
          id: public
          supplier_id: public
          item: internal
          unit: internal
          price: internal
          active: internal
          updated_at: internal
          updated_by: internal

# Права на запись. Каждое — отдельное одобренное действие, а не доступ к таблице.
# Человек в UI пишет сразу; confirm: true — важное действие, и в UI только после «Подтвердить».
# Агент только готовит: показывает человеку summary и применяет после его согласия в чате (commit_approved).
  cars-readonly:
    title: Автопарк — машины компании и их цена
    owner: doronec
    approved_by: doronec
    approved_at: 2026-09-21
    kind: connector
    connector:
      url: http://connector-cars:8080
      token_env: CONNECTOR_CARS_TOKEN
    datasets:
      cars:
        description: "Машины автопарка: марка, модель, год, цена по последней оценке, пробег, город, статус"
        fields:
          id: public
          brand: public
          model: public
          year: public
          price_rub: internal
          mileage_km: internal
          city: internal
          status: internal
          updated_at: internal

writes:
  tasks.task:create:
    title: Создать задачу на доске
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-18
    source: tasks-readonly
    params:
      title: { type: string, description: Суть задачи одной строкой }
      description: { type: string, required: false }
      priority: { type: enum, values: [low, normal, high, urgent] }
      status: { type: enum, values: [inbox, todo], required: false, description: По умолчанию inbox }
      assignee: { type: string, required: false, description: Имя из tasks.people }
      project: { type: string, required: false }
      due_at: { type: string, required: false, description: Срок, YYYY-MM-DD }

  tasks.task:update:
    title: Изменить статус, приоритет, исполнителя или срок задачи
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-18
    source: tasks-readonly
    params:
      task_id: { type: integer }
      status: { type: enum, values: [inbox, todo, in_progress, waiting, done], required: false }
      priority: { type: enum, values: [low, normal, high, urgent], required: false }
      assignee: { type: string, required: false, description: Имя из tasks.people }
      due_at: { type: string, required: false, description: Срок, YYYY-MM-DD }

  knowledge.note:create:
    title: Добавить запись в базу знаний (только дописывать)
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-18
    source: knowledge-readonly
    params:
      kind: { type: enum, values: [note, decision, summary, article] }
      title: { type: string }
      body: { type: string }
      tags: { type: string, required: false, description: Теги через запятую }
      task_id: { type: integer, required: false, description: id задачи, к которой относится запись }

  boards.board:create:
    title: Опубликовать новую общую доску
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-18
    source: boards-readonly
    params:
      name: { type: string, description: Название доски }
      content: { type: string, description: 'JSON холста {"els": [...]}, не больше 200 КБ' }
      note: { type: string, required: false, description: Что изменилось — попадёт в историю }

  boards.board:save:
    title: Опубликовать новую версию общей доски
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-18
    source: boards-readonly
    params:
      board_id: { type: integer }
      base_version: { type: integer, description: Версия, с которой начата правка; если доску уже обновили — отказ }
      content: { type: string, description: 'JSON холста {"els": [...]}, не больше 200 КБ' }
      name: { type: string, required: false }
      note: { type: string, required: false, description: Что изменилось — попадёт в историю }

  pastry.client:create:
    title: Добавить клиента кондитера
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      name: { type: string }
      phone: { type: string, required: false }
      email: { type: string, required: false }
      notes: { type: string, required: false }

  pastry.client:update:
    title: Изменить данные клиента
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      client_id: { type: integer }
      name: { type: string, required: false }
      phone: { type: string, required: false }
      email: { type: string, required: false }
      notes: { type: string, required: false }

  pastry.cake_type:create:
    title: Добавить тип торта в каталог
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      name: { type: string }
      price_per_kg: { type: integer, description: Цена за кг в рублях }
      notes: { type: string, required: false }

  pastry.cake_type:update:
    title: Изменить тип торта или снять с продажи
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      cake_type_id: { type: integer }
      name: { type: string, required: false }
      price_per_kg: { type: integer, required: false }
      active: { type: enum, values: [yes, no], required: false }
      notes: { type: string, required: false }

  pastry.recipe_line:upsert:
    title: Задать строку рецепта (количество ингредиента на 1 кг)
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      cake_type_id: { type: integer }
      ingredient_id: { type: integer }
      qty_per_kg: { type: integer, description: В единицах ингредиента на 1 кг торта }

  pastry.recipe_line:delete:
    title: Убрать ингредиент из рецепта
    confirm: true              # важное действие: в UI — только после «Подтвердить», агент — после согласия в чате
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      cake_type_id: { type: integer }
      ingredient_id: { type: integer }

  pastry.ingredient:create:
    title: Добавить позицию на склад (продукт, упаковка и т.п.)
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      name: { type: string }
      unit: { type: enum, values: [g, ml, pcs] }
      stock_qty: { type: integer, required: false, description: Начальный остаток; по умолчанию 0 }
      low_threshold: { type: integer, required: false, description: Порог «мало»; по умолчанию 0 }

  pastry.ingredient:update:
    title: Изменить позицию склада (название, единица, порог)
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      ingredient_id: { type: integer }
      name: { type: string, required: false }
      unit: { type: enum, values: [g, ml, pcs], required: false }
      low_threshold: { type: integer, required: false }

  pastry.stock:receive:
    title: Приход на склад по позиции
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      ingredient_id: { type: integer }
      qty: { type: integer, description: Сколько добавить в единицах позиции }
      note: { type: string, required: false }

  pastry.stock:adjust:
    title: Корректировка остатка (инвентаризация)
    confirm: true              # важное действие: в UI — только после «Подтвердить», агент — после согласия в чате
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      ingredient_id: { type: integer }
      qty_delta: { type: integer, description: Изменение остатка; отрицательное — списать }
      note: { type: string, required: false }

  pastry.order:create:
    title: Создать заказ торта
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      client_id: { type: integer }
      cake_type_id: { type: integer }
      weight_g: { type: integer, description: Вес торта в граммах }
      due_at: { type: string, description: Дата отдачи YYYY-MM-DD }
      due_time: { type: string, required: false, description: Время отдачи HH:MM }
      ordered_at: { type: string, required: false, description: Дата заказа YYYY-MM-DD; по умолчанию сегодня }
      price_rub: { type: integer, required: false, description: Цена в рублях; иначе price_per_kg × вес }
      prepaid_rub: { type: integer, required: false }
      comment: { type: string, required: false }

  pastry.order:update:
    title: Изменить заказ — статус, даты, деньги, комментарий
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      order_id: { type: integer }
      status: { type: enum, values: [new, confirmed, ready, delivered, cancelled], required: false, description: Статус baking — только через start_baking }
      due_at: { type: string, required: false }
      due_time: { type: string, required: false }
      ordered_at: { type: string, required: false }
      price_rub: { type: integer, required: false }
      prepaid_rub: { type: integer, required: false }
      comment: { type: string, required: false }

  pastry.order:start_baking:
    title: Взять заказ в готовку и списать ингредиенты по рецепту
    confirm: true              # важное действие: в UI — только после «Подтвердить», агент — после согласия в чате
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: pastry-readonly
    params:
      order_id: { type: integer }

  suppliers.supplier:create:
    title: Добавить поставщика
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: suppliers-readonly
    params:
      name: { type: string }
      city: { type: string }
      contact: { type: string, required: false }
      phone: { type: string, required: false }

  suppliers.offer:set_price:
    title: Изменить цену предложения поставщика
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: suppliers-readonly
    params:
      offer_id: { type: integer }
      price: { type: integer, description: Цена в рублях за единицу }

  suppliers.supplier:archive:
    title: Перенести поставщика в архив
    owner: ivan.petrov
    approved_by: ivan.petrov
    approved_at: 2026-09-19
    source: suppliers-readonly
    confirm: true              # важное действие: предложения поставщика перестают быть доступны
    params:
      supplier_id: { type: integer }
