# Источники этого стенда. Пусто — и это правильно: источник появляется здесь решением человека (ИБ и владелец
# данных), а не правкой манифеста тула. Пока список пуст, тулу нечего читать, и контракт допуска это скажет.
#
# Как добавить источник:
#   1. агент пишет коннектор (MCP «sandbox» → scaffold_connector, validate_connector) и черновик записи;
#   2. человек переносит черновик сюда, ставит approved_by, заводит токен и сервис коннектора.
# Пример целиком — connectors/ и «Задача на коннектор» в AGENTS.md.
#
# Потрогать песочницу, ничего не подключая: `make demo-on` — включит демо-слой (registry/demo/sources.yaml).
version: 1

policy:
  max_ttl_days: 90
  token_ttl_seconds: 900
  max_rows: 1000
  write_confirmation_ttl_seconds: 300
  idle_days: 30
  idle_grace_days: 7

sources: {}

writes: {}
